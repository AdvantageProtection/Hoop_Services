/* ============================================================
   HOOP × ADVANTAGE FS · "LIVING DOCUMENT" · V9.1 (editorial)
   ------------------------------------------------------------
   V9.1 edits:
   - All three logos (hero main + pair, and section logos)
     sit in signature-style plates: grey hairline border with
     a thicker grey left edge.
   - Palette unified to the booking page's neutral greys/ink;
     the mortgage blue is the only section colour retained.
   - Sidebar links are uniform: booking links no longer
     indented/smaller and now anchor to the on-page booking
     buttons (#book-protection / #book-mortgage).
   - Style system collapsed to header / body / bold body.
     Mono micro-labels removed; JetBrains Mono dropped.
   ============================================================ */

/* ---- Tokens ---- */
:root {
    color-scheme: light;

    --side-w: 300px;
    --gutter: clamp(20px, 5vw, 72px);
    --measure: 74ch;
    --mast-h: 68px;
    --r: 10px;

    --paper: #f6f6f4;
    --paper-2: #ecece9;
    --ink: #0e0e10;      /* uniform darkest for ALL text */
    --ink-2: #0e0e10;
    --ink-3: #0e0e10;
    --ink-4: #0e0e10;
    --rule: #dcdcd8;
    --rule-strong: #c3c3bd;
    --card: #ffffff;

    /* Neutral accent — matches the booking page's monochrome
       system. The only colour on the page is the mortgage blue. */
    --accent: #0e0e10;
    --accent-deep: #0e0e10;
    --accent-wash: rgba(14, 14, 16, 0.05);
    --accent-rule: rgba(14, 14, 16, 0.25);

    /* Mortgage accent — blue. Mortgage sections only. */
    --m-accent: #4a72a8;
    --m-accent-deep: #3a5c8a;
    --m-accent-wash: rgba(74, 114, 168, 0.08);
    --m-accent-rule: rgba(74, 114, 168, 0.32);

    /* Section CTA colours */
    --cta-bg: #0e0e10;
    --cta-ink: #ffffff;

    --success: #0e9f5d;
    --success-deep: #0b7c49;
    --success-rule: rgba(14, 159, 93, 0.35);

    --font-display: 'Clash Display', system-ui, sans-serif;
    --font-body: 'Satoshi', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', Georgia, serif;

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
